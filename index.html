          --ok: #4cd08e;
          --okbg: #14301f;

        gap: 12px;
        flex-wrap: wrap;

        margin: 0 0 2px;

      .sub {

        margin: 0;
        font-size: 14px;
      }
      .tg {
        display: flex;
        gap: 6px;

      button {
        font: inherit;
        cursor: pointer;

        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px;
      }
      .pill.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }

        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      .flow div {

        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .flow b {
        display: block;
        color: var(--ac);
        font-size: 12px;
      }

        display: grid;
        grid-template-columns: 290px 1fr;
        gap: 14px;

        .grid {
          grid-template-columns: 1fr;

        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;

        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mu);
        margin: 0 0 10px;
      }
      .sim {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 8px;
        border: 1px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        border-radius: 10px;
        padding: 9px 11px;
      }
      .sim:hover {
        border-color: var(--ac);
      }
      .sim small {
        display: block;
        color: var(--mu);
        font-size: 12px;
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 13px;
      }
      .log li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--bd);
      }
      .st {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--okbg);
        color: var(--ok);
        white-space: nowrap;
      }
      .st.m {
        background: var(--wnbg);
        color: var(--wn);
      }
      .screen {
        min-height: 430px;
        display: flex;
        flex-direction: column;
      }
      .idle {
        margin: auto;
        text-align: center;
        color: var(--mu);
      }
      .idle .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ok);
        display: inline-block;
        margin-right: 6px;
        animation: p 1.6s infinite;
      }
      @keyframes p {
        50% {
          opacity: 0.25;
        }
      }
      @keyframes pop {
        from {
          transform: translateY(10px) scale(0.98);
          opacity: 0;
        }
      }
      .pop {
        animation: pop 0.25s ease-out;
      }
      .ring {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        background: var(--acbg);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;

        align-items: center;
        margin-bottom: 12px;

        height: 52px;

        background: var(--ac);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 700;
        flex: none;

        background: var(--bad);
      }
      .av.q {
        background: var(--mu);
      }
      .nm {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
      }
      .ig {
        color: var(--ac);
        text-decoration: none;
        font-size: 14px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .tag {
        font-size: 12px;
        background: var(--acbg);
        color: var(--ac);
        padding: 1px 8px;
        border-radius: 999px;
      }
      .cols {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 12px;
      }
      @media (max-width: 600px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }

        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .box h3 {
        margin: 0 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mu);
      }

        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td {
        padding: 4px 0;
        border-top: 1px solid var(--bd);
      }
      tr:first-child td {
        border-top: 0;
      }
      td:last-child {
        text-align: right;
        color: var(--mu);
        white-space: nowrap;

        font-size: 20px;
        color: var(--tx);

        color: var(--tx);

        grid-template-columns: 1fr 1fr;

        font-size: 12px;
        color: var(--mu);

        color: var(--tx);

        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 10px;
        font-weight: 600;
      }

        display: none;

        .log li{padding:10px 0}
      }
      @media (prefers-reduced-motion:reduce){aside,.scrim{transition:none!important}}

  </head>

        cur = null,
        log = [],
        tm = null;
      const $ = (id) => document.getElementById(id),
        t = (k) => T[lg][k],
        v = (id) => $(id).value.trim();
      const esc = (s) =>
        s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const fd = (i) =>
        new Date(i + "T12:00").toLocaleDateString(
          lg === "el" ? "el-GR" : "en-GB",
          { weekday: "short", day: "numeric", month: "short" },
        );
      const dd = () => {
        const d = new Date();
        d.setDate(d.getDate() + 2);
        return d.toISOString().slice(0, 10);
      };
      function lab(k) {
        const c = C[k];
        return c ? c.n : k === "hidden" ? t("hid") : t("newc");
      }
      function fmt(s) {
        return (
          String(Math.floor(s / 60)).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      }
      function toast(m) {
        const e = $("toast");
        if (e) {
          e.textContent = m;
          e.hidden = false;
          setTimeout(() => {
            e.hidden = true;
          }, 2500);
        }
      }
      function sim(k) {
        closeSheet();
        scrollTo({ top: 0, behavior: "smooth" });
        if (cur) end("m");
        cur = {
          k,
          st: "ring",
          s: 0,
          ms: 120 + Math.floor(Math.random() * 90),
          ed: 0,
          add: 0,
        };
        render();
      }
      function ans() {
        cur.st = "live";
        clearInterval(tm);
        tm = setInterval(() => {
          cur.s++;
          const e = $("tm");
          if (e) e.textContent = fmt(cur.s);
        }, 1000);
        render();
      }
      function end(r) {
        if (!cur) return;
        clearInterval(tm);
        const n = new Date();
        log.unshift({
          k: cur.k,
          r,
          t: n.getHours() + ":" + String(n.getMinutes()).padStart(2, "0"),
        });
        cur = null;
        render();
      }
      function ed(x) {
        cur.ed = x;
        render();
      }
      function addf(x) {
        cur.add = x;
        render();
      }
      function sv() {
        const s = S.find((x) => x[0] === v("f-s"));
        if (s) $("f-m").value = s[1];
      }
      function saveAp() {
        const d = v("f-d"),
          tt = v("f-t"),
          m = parseInt(v("f-m"), 10);
        if (!d || !tt || !m) return;
        C[cur.k].up = { d, tm: tt, s: v("f-s"), m };
        cur.ed = 0;
        render();
        toast(t("saved"));
      }
      function cxl() {
        C[cur.k].up = null;
        render();
        toast(t("cxd"));
      }
      function saveCl() {
        const n = v("c-n");
        if (!n) return;
        const note = esc(v("c-t"));
        C[cur.k] = {
          n: esc(n),
          ig: esc(v("c-i").replace(/^@/, "")) || "—",
          tags: { el: [T.el.ntag], en: [T.en.ntag] },
          v: [],
          note: { el: note, en: note },
          c: 1,
          x: 0,
          up: null,
        };
        cur.add = 0;
        render();
        toast(t("created"));
      }
      function form(a) {
        a = a || { d: dd(), tm: "11:00", s: S[0][0], m: S[0][1] };
        return `<div class="box pop"><h3>${t("up")}</h3><div class="fg"><label>${t("date")}<input type="date" id="f-d" value="${a.d}"></label><label>${t("time")}<input type="time" id="f-t" value="${a.tm}" step="900"></label><label>${t("svc")}<select id="f-s" onchange="sv()">${S.map((s) => `<option ${s[0] === a.s ? "selected" : ""}>${s[0]}</option>`).join("")}</select></label><label>${t("dur")}<input type="number" id="f-m" min="15" step="5" value="${a.m}"></label></div><div class="btns" style="margin-top:10px"><button class="b g" onclick="saveAp()">${t("save")}</button><button class="b o" onclick="ed(0)">${t("back")}</button></div></div>`;
      }
      function ap(c) {
        const a = c.up,
          x = cur.st === "live" ? "" : "disabled";
        if (cur.ed) return form(a);
        return `<div class="box ${a ? "up" : ""} pop"><h3>${t("up")}</h3><div class="aprow"><div>${a ? `<b>${fd(a.d)} · ${a.tm}</b><div class="sub">${a.s} · ${a.m} ${t("min")}</div>` : t("none")}</div><div class="btns">${a ? `<button class="b p" ${x} onclick="ed(1)">${t("edit")}</button><button class="b o" ${x} onclick="cxl()">${t("cx")}</button>` : `<button class="b p" ${x} onclick="ed(1)">${t("book")}</button>`}</div></div></div>`;
      }
      function card() {
        const k = cur.k,
          c = C[k];
        const ring =
          cur.st === "ring"
            ? `<div class="ring pop"><div><b>${t("inc")}</b><div class="num">${L[k]} · ${t("ms")} ${cur.ms} ms</div></div><div class="btns"><button class="b g" onclick="ans()">${t("ans")}</button><button class="b r" onclick="end('d')">${t("dec")}</button></div></div>`
            : `<div class="ring live"><div><b>${t("live")} · <span id="tm">${fmt(cur.s)}</span></b><div class="num">${L[k]}</div></div><div class="btns"><button class="b r" onclick="end('a')">${t("hang")}</button></div></div>`;
        const top = `<div id="toast" class="toast" hidden></div>` + ring;
        if (!c) {
          const hid = k === "hidden";
          if (cur.add)
            return (
              top +
              `<div class="box pop"><h3>${t("newc")}</h3><div class="fg"><label>${t("nm")}<input id="c-n"></label><label>${t("ig")}<input id="c-i" placeholder="@"></label></div><label style="margin-top:8px">${t("notes")}<input id="c-t"></label><div class="btns" style="margin-top:10px"><button class="b g" onclick="saveCl()">${t("cr")}</button><button class="b o" onclick="addf(0)">${t("back")}</button></div></div>`
            );
          return (
            top +
            `<div class="id pop"><div class="av q">?</div><div><div class="nm">${hid ? t("hid") : t("newc")}</div><div class="sub">${hid ? t("hids") : t("news")}</div></div></div>` +
            (hid
              ? ""
              : `<button class="b p" onclick="addf(1)">${t("add")}</button>`)
          );
        }
        let h = "";
        if (c.bad)
          h += `<div class="ban pop">⛔ ${t("bl")} — ${c.reason[lg]}<span>${t("blr")}</span></div>`;
        h += `<div class="id pop"><div class="av ${c.bad ? "bad" : ""}">${c.n[0]}</div><div><div class="nm">${c.n}</div><a class="ig" href="#" onclick="return false">@${c.ig}</a><div class="tags">${c.tags[lg].map((x) => `<span class="tag">${x}</span>`).join("")}</div></div></div>`;
        if (!c.bad) h += ap(c);
        h += `<div class="cols pop"><div class="box"><h3>${t("visits")}</h3>${c.v.length ? `<table>${c.v.map((x) => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]} ${t("min")}</td></tr>`).join("")}</table>` : "—"}</div><div><div class="box"><h3>${t("calls")}</h3><div class="stats"><div><b>${c.c}</b>${t("calls")}</div><div><b>${c.x}</b>${t("missed")}</div></div></div><div class="box"><h3>${t("notes")}</h3>${c.note[lg] || "—"}</div></div></div>`;
        return top + h;
      }
      function render() {
        document.documentElement.lang = lg;
        $("t1").textContent = t("t1");
        $("h-sim").textContent = t("hs");
        $("h-log").textContent = t("hl");
        $("foot").textContent = t("foot");
        $("sims").innerHTML = SIM.map(
          (s) =>
            `<button class="sim" onclick="sim('${s[0]}')">📞 ${t(s[1])[0]}<small>${t(s[1])[1]}</small></button>`,
        ).join("");
        $("log").innerHTML = log
          .map(
            (l) =>
              `<li><span>${l.t} · ${lab(l.k)}</span><span class="st ${l.r === "a" ? "" : "m"}">${t(l.r)}</span></li>`,
          )
          .join("");
        $("screen").innerHTML = cur
          ? card()
          : `<div class="idle"><span class="dot"></span>${t("idle")}<br><button class="b p cta" onclick="openSheet()">📞 ${t("hs")}</button></div>`;
        $("dock").innerHTML = `📞 ${t("hs")}${log.length ? `<span class="bdg">${log.length}</span>` : ""}`;
        document
          .querySelectorAll("[data-l]")
          .forEach((b) => b.classList.toggle("on", b.dataset.l === lg));
      }
      document.querySelectorAll("[data-l]").forEach(
        (b) =>
          (b.onclick = () => {
            lg = b.dataset.l;
            render();
          }),
      );
      const openSheet = () => document.body.classList.add("sheet"),
        closeSheet = () => document.body.classList.remove("sheet");
      $("dock").onclick = openSheet;
      $("x").onclick = closeSheet;
      $("scrim").onclick = closeSheet;
      addEventListener("keydown", (e) => e.key === "Escape" && closeSheet());
      render();
    </script>
  </body>
</html>
